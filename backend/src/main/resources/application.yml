spring:
  application:
    name: knowledge-assist
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:knowledgeassist}
    username: ${POSTGRES_USER:knowledgeassist}
    password: ${POSTGRES_PASSWORD:change-me-postgres-password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:50}MB
      max-request-size: ${MAX_UPLOAD_MB:50}MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:knowledgeassist}
    password: ${RABBITMQ_PASSWORD:change-me-rabbitmq-password}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0

  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
          temperature: 0.1
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}

server:
  port: ${BACKEND_PORT:8080}

knowledgeassist:
  storage:
    upload-dir: ${UPLOAD_DIR:/app/uploads}
    max-upload-bytes: 52428800
  security:
    jwt-access-secret: ${JWT_ACCESS_SECRET}
    jwt-refresh-secret: ${JWT_REFRESH_SECRET}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    allow-self-registration: ${ALLOW_SELF_REGISTRATION:true}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
  rag:
    chunk-size-tokens: ${RAG_CHUNK_SIZE_TOKENS:850}
    chunk-overlap-tokens: ${RAG_CHUNK_OVERLAP_TOKENS:120}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.25}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
    max-history-turns: ${RAG_MAX_HISTORY_TURNS:6}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.knowledgeassist: INFO
    org.springframework.security: WARN
